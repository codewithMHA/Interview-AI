services:
  # ==========================================
  # MongoDB Database Service
  # ==========================================
  mongo:
    image: mongo:7.0
    container_name: interviewai-mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: interviewai
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - interviewai-network

  # ==========================================
  # Backend API Server Service
  # ==========================================
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: interviewai-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_ORIGIN=http://localhost:3000
      - MONGODB_URI=mongodb://mongo:27017/interviewai
      - JWT_SECRET=${JWT_SECRET:-production_jwt_secret_placement_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JUDGE0_API_URL=${JUDGE0_API_URL:-https://judge0-ce.p.rapidapi.com}
      - JUDGE0_API_KEY=${JUDGE0_API_KEY:-}
    depends_on:
      - mongo
    networks:
      - interviewai-network

  # ==========================================
  # Frontend Client Service
  # ==========================================
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: interviewai-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - interviewai-network

volumes:
  mongo-data:
    driver: local

networks:
  interviewai-network:
    driver: bridge

